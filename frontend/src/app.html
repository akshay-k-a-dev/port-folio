<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" href="%sveltekit.assets%/favicon.png" />

    <!-- Fonts: DM Serif Display + DM Sans + JetBrains Mono -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="" />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;1,9..40,300&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />

    <!-- SEO -->
    <meta name="description" content="AI-powered developer portfolio — showcasing the best work from public GitHub repositories, curated by Groq AI with human oversight." />
    <meta name="theme-color" content="#0f0f0f" />

    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover" class="bg-ink-900 text-ink-100">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
